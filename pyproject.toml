[project]
name = "gen-for-smallbusiness"
version = "0.1.0"
description = "소상공인용 광고 콘텐츠 제작 플랫폼"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.116.0,<0.117.0",
  "uvicorn[standard]>=0.35.0,<0.36.0",
  "sqlalchemy>=2.0.40,<2.1.0",
  "pydantic>=2.11.0,<2.12.0",
  "pydantic-settings>=2.9.0,<2.10.0",
  "python-multipart>=0.0.20,<0.0.21",
  "httpx>=0.28.1,<0.29.0",
  "ffmpeg-python>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
ai = [
  "torch==2.10.*",
  "torchvision==0.25.*",
  "torchaudio==2.10.*",
  "diffusers @ git+https://github.com/huggingface/diffusers",
  "huggingface-hub>=0.34.0,<0.35.0",
  "transformers>=4.50.0,<4.56.0",
  "accelerate>=1.6.0,<1.11.0",
  "safetensors>=0.6.0,<0.7.0",
  "sentencepiece>=0.2.0,<0.3.0",
  "Pillow>=11.3.0,<11.4.0",
  "openai>=1.107.0,<1.108.0",
  "ace-step @ git+https://github.com/ace-step/ACE-Step.git",
]
dev = [
  "pytest>=8.4.0,<8.5.0",
  "pytest-asyncio>=1.1.0,<1.2.0",
  "ruff>=0.12.0,<0.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
