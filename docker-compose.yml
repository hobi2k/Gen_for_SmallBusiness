services:
  app:
    image: lifestyle-shop-ai-mvp:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-local-docker}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-docker-local}
      IMAGE_WORKER_ENABLED: ${IMAGE_WORKER_ENABLED:-false}
      IMAGE_WORKER_URL: ${IMAGE_WORKER_URL:-http://image-worker:8001}
      IMAGE_WORKER_TOKEN: ${IMAGE_WORKER_TOKEN:-}
      IMAGE_WORKER_TIMEOUT_MS: ${IMAGE_WORKER_TIMEOUT_MS:-45000}
      IMAGE_WORKER_PROFILE: ${IMAGE_WORKER_PROFILE:-full}
    volumes:
      - type: bind
        source: ${APP_STORAGE_PATH:-./storage}
        target: /app/storage
      - type: bind
        source: ./references
        target: /app/references
        read_only: true
    logging:
      driver: json-file
      options:
        max-size: "${APP_LOG_MAX_SIZE:-10m}"
        max-file: "${APP_LOG_MAX_FILE:-3}"
    stop_grace_period: 20s
    restart: ${APP_RESTART_POLICY:-unless-stopped}

  image-worker:
    profiles: ["gpu"]
    image: lifestyle-shop-image-worker:local
    build:
      context: .
      dockerfile: workers/image_worker/Dockerfile
    init: true
    ports:
      - "${IMAGE_WORKER_PORT:-8001}:8001"
    environment:
      IMAGE_WORKER_TOKEN: ${IMAGE_WORKER_TOKEN:-}
      IMAGE_WORKER_PROFILE: ${IMAGE_WORKER_PROFILE:-full}
      IMAGE_WORKER_DEVICE: ${IMAGE_WORKER_DEVICE:-}
      IMAGE_MODEL_BASE: ${IMAGE_MODEL_BASE:-}
      IMAGE_MODEL_CONTROLNET: ${IMAGE_MODEL_CONTROLNET:-}
      IMAGE_MODEL_IP_ADAPTER_REPO: ${IMAGE_MODEL_IP_ADAPTER_REPO:-}
      IMAGE_MODEL_IP_ADAPTER_WEIGHT: ${IMAGE_MODEL_IP_ADAPTER_WEIGHT:-}
      IMAGE_NUM_INFERENCE_STEPS: ${IMAGE_NUM_INFERENCE_STEPS:-}
      IMAGE_GUIDANCE_SCALE: ${IMAGE_GUIDANCE_SCALE:-}
      IMAGE_CONTROLNET_SCALE: ${IMAGE_CONTROLNET_SCALE:-}
      IMAGE_IP_ADAPTER_SCALE: ${IMAGE_IP_ADAPTER_SCALE:-}
    volumes:
      - type: bind
        source: ${APP_STORAGE_PATH:-./storage}
        target: /app/storage
      - type: bind
        source: ./references
        target: /app/references
        read_only: true
      - type: bind
        source: ./.cache/huggingface
        target: /app/.cache/huggingface
    stop_grace_period: 20s
    restart: ${APP_RESTART_POLICY:-unless-stopped}
